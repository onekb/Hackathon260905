[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.28"
evm_version = "cancun"
network = "monad"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
